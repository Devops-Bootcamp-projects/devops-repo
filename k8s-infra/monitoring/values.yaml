prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: "5GB"
    scrapeInterval: "30s"
    # This allows Prometheus to find ServiceMonitors in any namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        memory: "400Mi"
      limits:
        memory: "1Gi"
    # FIXED: The correct way to request a Persistent Volume in this chart
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: "admin-user"
    passwordKey: "admin-password"
  
  # 1. ADDED: Grafana Ingress configuration matching your cert-manager rules
  ingress:
    enabled: true
    ingressClassName: public
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      acme.cert-manager.io/http01-edit-in-place: "true"
    hosts:
      - grafana.tundehammed.online
    path: /
    tls:
      - secretName: grafana-tundehammed-tls
        hosts:
          - grafana.tundehammed.online

  # 2. CHANGED: Swapped from NodePort to ClusterIP
  service:
    type: ClusterIP 
  persistence:
    enabled: true
    size: 2Gi