apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: devops-project
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linker-backend
  namespace: devops-project
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # 1. Enable Vault Agent Injection
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: 'app-role'
        vault.hashicorp.com/agent-inject-secret-config: 'secrets/data/backend-secrets'
        
        # 2. Dynamically build the DATABASE_URL and exports
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secrets/data/backend-secrets" -}}
          export CLOUDINARY_CLOUD_NAME="{{ .Data.data.CLOUDINARY_CLOUD_NAME }}"
          export CLOUDINARY_API_KEY="{{ .Data.data.CLOUDINARY_API_KEY }}"
          export CLOUDINARY_API_SECRET="{{ .Data.data.CLOUDINARY_API_SECRET }}"
          export DB_USER="{{ .Data.data.DB_USER }}"
          export DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          export DATABASE_URL="postgresql://{{ .Data.data.DB_USER }}:{{ .Data.data.DB_PASSWORD }}@postgres-service:5432/linker_db?schema=public"
          {{- end -}}
    spec:
      # 3. Link the ServiceAccount for authentication
      serviceAccountName: backend-sa
      containers:
      - name: backend
        image: hammedbabatunde/devopsbootcamp-backend:1.10
        ports:
        - containerPort: 3001
        envFrom:
        # 4. Kept ConfigMap for non-sensitive data (secretRef is REMOVED)
        - configMapRef:
            name: app-config
        # 5. Entrypoint Wrapper: Source the Vault file before starting the app
        command: ["/bin/sh", "-c"]
        args:
          - |
            source /vault/secrets/config &&
            node dist/main.js
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devops-project
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3001