apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: devops-project
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linker-frontend
  namespace: devops-project
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Using a dedicated identity is better for security auditing
      serviceAccountName: frontend-sa
      containers:
      - name: frontend
        # Ensure this is the 'fixed' image version!
        image: hammedbabatunde/devopsbootcamp-frontend:1.11
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: devops-project
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000