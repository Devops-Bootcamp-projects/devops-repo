apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-monitoring-stack
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: The Official Helm Chart
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 61.3.1 # Pinning the version is the "Optimizer" way
      helm:
        valueFiles:
          - $values/k8s-infra/monitoring/values.yaml
    
    # Source 2: Your Git Repo (defined as '$values')
    - repoURL: 'https://github.com/Devops-Bootcamp-projects/devops-repo'
      targetRevision: HEAD # Or your specific branch
      ref: values
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring # Keeps monitoring separate from your app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Recommended for large charts like Prometheus